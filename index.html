<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFM 382 Study Site</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#14231f;--mute:#5a6b66;--line:#d5ddda;--a:#0f766e;--at:#d9f0ec;--b:#b45309;--bt:#fbe9d2;--r:#b91c1c;--rt:#fbdcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--card:#182420;--ink:#e6efec;--mute:#9bb0aa;--line:#2b3b37;--a:#4fd1c0;--at:#143531;--b:#f0a85a;--bt:#3b2a14;--r:#ff8c8c;--rt:#411c1c}}
:root[data-theme="dark"]{--bg:#0f1816;--card:#182420;--ink:#e6efec;--mute:#9bb0aa;--line:#2b3b37;--a:#4fd1c0;--at:#143531;--b:#f0a85a;--bt:#3b2a14;--r:#ff8c8c;--rt:#411c1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.02em}.mute{color:var(--mute);margin:0 0 14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
nav button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
nav button.on,.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.no{border-color:var(--r);color:var(--r)}.btn.ok{border-color:var(--a);color:var(--a)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0}
.fc{min-height:170px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;font-size:1.1rem;border-top:5px solid var(--a)}
.fc.back{background:var(--at);border-top-color:var(--b)}
.tag{font-size:.78rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.good{background:var(--at);border-color:var(--a)}.opt.bad{background:var(--rt);border-color:var(--r)}
.why{background:var(--bt);border-left:4px solid var(--b);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);width:0}
label{display:block;font-size:.85rem;color:var(--mute);font-weight:600}
input,select{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.res div{background:var(--at);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--mute)}.res b{display:block;font-size:1.2rem;color:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tl div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--a);border-radius:8px;padding:8px 10px;font-size:.88rem}.tl b{display:block}
section{display:none}section.on{display:block}
</style></head><body><main>
<h1>AFM 382 Study Site</h1>
<p class="mute">Midterm review: flashcards, quiz and calculators.</p>
<div class="tl">
<div><b>1. Predict</b>Cost behaviour, regression, learning curve</div>
<div><b>2. Plan</b>CVP, DOL</div>
<div><b>3. Decide</b>Relevant costs, constraints, Solver</div>
<div><b>4. Record</b>Cost flow, journal entries, process costing</div>
<div><b>5. Evaluate</b>Over/under-applied, true-up</div></div>
<nav id="nav"><button data-t="cards" class="on">Flashcards</button><button data-t="quiz">Quiz</button><button data-t="calc">Calculators</button></nav>

<section id="cards" class="on">
<div class="row"><select id="topic" aria-label="Topic" style="width:auto"></select><button class="btn" id="shuf">Shuffle</button><span class="mute" id="prog" style="margin:0"></span></div>
<div class="bar"><i id="pbar"></i></div>
<div class="card fc" id="fc" tabindex="0" role="button" aria-label="Flip card"></div>
<div class="row"><button class="btn no" id="again">Again</button><button class="btn ok" id="got">Got it</button><button class="btn" id="flip">Flip</button></div>
</section>

<section id="quiz"><div id="qbox"></div></section>

<section id="calc">
<div class="card"><b>CVP</b>
<div class="g"><div><label>Price</label><input id="p" type="number" value="50"></div><div><label>Variable cost</label><input id="v" type="number" value="30"></div><div><label>Fixed costs</label><input id="f" type="number" value="120000"></div><div><label>Target profit</label><input id="tp" type="number" value="60000"></div></div>
<div class="res" id="cvp"></div></div>
<div class="card"><b>Learning curve</b>
<div class="g"><div><label>First unit avg time (a)</label><input id="la" type="number" value="2000"></div><div><label>Learning rate L (%)</label><input id="ll" type="number" value="70"></div><div><label>Units (x)</label><input id="lx" type="number" value="4"></div></div>
<div class="res" id="lc"></div></div>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var CARDS=[
["Cost flow","COGM = ?","Total mfg costs + Beg WIP − End WIP"],
["Cost flow","COGS = ?","Beg FG + COGM − End FG"],
["Cost flow","Total manufacturing costs = ?","Direct materials used + Direct labour + Overhead"],
["Cost flow","Absorption vs variable: fixed mfg overhead is…","Absorption: product cost. Variable costing: period cost."],
["CVP","Break-even units and dollars","FC ÷ CM per unit.  FC ÷ CM%."],
["CVP","Target profit units","(FC + Target profit) ÷ CM per unit"],
["CVP","Average CM for a sales mix","Σ (CM × mix %), then divide totals by this average"],
["CVP","DOL = ? and what does it predict?","Total CM ÷ Operating income. % change in profit = % change in sales × DOL"],
["Estimation","High-low slope and fixed cost","Slope = (High cost − Low cost) ÷ (High activity − Low activity). Fixed = Cost − Slope × Activity"],
["Estimation","Regression: how to judge a driver","R² near 1 = good fit. p < 0.05 (|t| > ~2) = significant. Intercept = fixed, X coef = variable per unit"],
["Learning","Learning curve model","y = a·x^b (y = cumulative average). b = ln(L) ÷ ln(2)"],
["Learning","Total vs incremental time","Total = x × y. Incremental = Total(x) − Total(x−1)"],
["Learning","Learning rate from regression","ln y = ln a + b ln x. a = e^intercept, L = 2^slope"],
["Decisions","When is a cost relevant?","Future AND differs between alternatives. Sunk and unavoidable/allocated fixed costs are not."],
["Decisions","Single bottleneck rule","Rank by CM per unit of the constraint, produce best first up to demand"],
["Decisions","Solver setup","Decision cells = units; objective = SUMPRODUCT(CM, units) Max; constraints usage ≤ available; non-negative; Simplex LP"],
["Decisions","Shadow price","Profit gain from one extra unit of a binding resource (0 if not binding)"],
["Overhead","POHR and applied overhead","POHR = Est. OH ÷ Est. base. Applied = POHR × actual base"],
["Overhead","Under-applied overhead entry","Applied < Actual. Dr COGS / Cr MOH"],
["Overhead","Over-applied overhead entry","Applied > Actual. Dr MOH / Cr COGS"],
["Journal","Apply overhead","Dr WIP / Cr MOH"],
["Journal","Direct materials used; indirect materials used","Dr WIP / Cr Raw materials.  Dr MOH / Cr Raw materials"],
["Journal","Complete goods; sell goods","Dr FG / Cr WIP.  Dr A/R or Cash / Cr Sales, and Dr COGS / Cr FG"],
["Process","SERCA","Summarize units, Equivalent units, Calculate costs, Record cost per EU, Assign costs"],
["Process","Equivalent units (weighted average)","Completed units + End WIP units × % complete, per bucket. Transferred-in is 100%"],
["Spoilage","Normal vs abnormal spoilage","Normal: product cost. Abnormal: period expense. Dr Abnormal spoilage loss / Cr WIP"]];
var deck=[],ix=0,back=false,known={};
var tp=$("topic");var topics=["All"];CARDS.forEach(function(c){if(topics.indexOf(c[0])<0)topics.push(c[0])});
tp.innerHTML=topics.map(function(t){return "<option>"+t+"</option>"}).join("");
function build(sh){deck=CARDS.filter(function(c){return tp.value==="All"||c[0]===tp.value});if(sh)deck.sort(function(){return Math.random()-.5});ix=0;back=false;known={};show()}
function show(){var el=$("fc");if(!deck.length){el.textContent="No cards";return}
var c=deck[ix];back=back&&true;el.className="card fc"+(back?" back":"");
el.innerHTML="<div class='tag'>"+c[0]+(back?" · answer":" · question")+"</div><p>"+(back?c[2]:c[1])+"</p>";
var n=Object.keys(known).length;$("prog").textContent=(ix+1)+" / "+deck.length+" · known "+n;$("pbar").style.width=(n/deck.length*100)+"%"}
function flip(){back=!back;show()}function next(){ix=(ix+1)%deck.length;back=false;show()}
$("fc").onclick=flip;$("flip").onclick=flip;$("shuf").onclick=function(){build(true)};tp.onchange=function(){build(false)};
$("got").onclick=function(){known[ix]=1;next()};$("again").onclick=function(){delete known[ix];next()};
$("fc").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
build(false);

var Q=[
["A firm has total manufacturing costs of $200,000, Beg WIP $30,000 and End WIP $45,000. What is COGM?",["$185,000","$215,000","$200,000","$275,000"],0,"COGM = 200,000 + 30,000 − 45,000 = 185,000. WIP adjusts total manufacturing costs."],
["Fixed costs $60,000, price $25, variable cost $15. Break-even units?",["6,000","2,400","4,000","3,000"],0,"CM = $10. 60,000 ÷ 10 = 6,000 units."],
["Which cost is relevant to a decision to drop a product?",["Avoidable fixed costs of that product","Allocated head-office overhead that continues","Cost of equipment already bought","Last year’s advertising"],0,"Relevant = future and differs. Allocated costs that continue, and sunk costs, are irrelevant."],
["Applied overhead is $480,000 and actual overhead is $500,000. The adjusting entry (to COGS) is:",["Dr COGS 20,000 / Cr MOH 20,000","Dr MOH 20,000 / Cr COGS 20,000","Dr WIP 20,000 / Cr MOH 20,000","No entry needed"],0,"Applied < actual means under-applied: expense was understated, so Dr COGS, Cr MOH."],
["An 80% learning curve, first-unit average time 100 hours. Total time for 4 units?",["256 hours","320 hours","400 hours","64 hours"],0,"Average at 4 units = 100 × 0.8 × 0.8 = 64. Total = 4 × 64 = 256."],
["CM $90,000, operating income $30,000. Sales units rise 5%. Operating income rises by about:",["15%","5%","3%","30%"],0,"DOL = 90 ÷ 30 = 3. 3 × 5% = 15%."],
["Product A: CM $12 uses 2 machine hours. Product B: CM $15 uses 3 hours. Machine hours are the bottleneck. Which first?",["A (6 per hour)","B (5 per hour)","B (higher CM)","Equal"],0,"Rank by CM per bottleneck hour: A = 6, B = 5."],
["A regression gives the driver a p-value of 0.31. Conclusion?",["Driver is not statistically significant","Driver is significant","Fixed cost is zero","R² must be 1"],0,"p above 0.05 means we cannot say the driver explains cost."],
["The entry to apply overhead to production is:",["Dr WIP / Cr MOH","Dr MOH / Cr WIP","Dr COGS / Cr MOH","Dr FG / Cr MOH"],0,"Applied overhead is added to WIP and credited to the MOH account."],
["1,000 units started, 600 completed, 400 in ending WIP 50% complete for conversion. Equivalent units, conversion (weighted average, no beg WIP)?",["800","600","1,000","1,200"],0,"600 + 400 × 50% = 800."],
["Abnormal spoilage cost is:",["A period expense (loss)","Added to finished goods cost","Added to all inventory cost","Ignored"],0,"Abnormal spoilage comes from inefficiency, so it is expensed, not inventoried."],
["Under variable costing, fixed manufacturing overhead is treated as:",["A period cost","A product cost","A prime cost","An asset"],0,"Variable costing expenses fixed manufacturing overhead as incurred."]];
var qi=0,qs=0,order=[];
function qrender(){var b=$("qbox");if(qi>=Q.length){b.innerHTML="<div class='card'><b>Done: "+qs+" / "+Q.length+"</b><p class='mute'>Retake to shuffle again.</p><button class='btn pri' id='rq'>Retake</button></div>";$("rq").onclick=function(){qi=0;qs=0;Q.sort(function(){return Math.random()-.5});qrender()};return}
var q=Q[qi];order=q[1].map(function(_,i){return i}).sort(function(){return Math.random()-.5});
b.innerHTML="<div class='card'><div class='tag'>Question "+(qi+1)+" of "+Q.length+" · score "+qs+"</div><p>"+q[0]+"</p><div id='ops'></div><div id='ex'></div></div>";
order.forEach(function(oi){var o=document.createElement("button");o.className="btn opt";o.textContent=q[1][oi];o.onclick=function(){pick(o,oi)};$("ops").appendChild(o)})}
function pick(btn,oi){var q=Q[qi],bs=$("ops").children;for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(q[1][order[i]]===q[1][q[2]])bs[i].classList.add("good")}
if(oi===q[2])qs++;else btn.classList.add("bad");
$("ex").innerHTML="<div class='why'>"+q[3]+"</div><div class='row'><button class='btn pri' id='nx'>Next</button></div>";$("nx").onclick=function(){qi++;qrender()}}
qrender();

function f(n,d){return isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:d===undefined?2:d}):"–"}
function cv(){var p=+$("p").value,v=+$("v").value,F=+$("f").value,t=+$("tp").value,cm=p-v,u=(F+t)/cm,oi=t;
$("cvp").innerHTML=[["CM / unit","$"+f(cm)],["CM %",f(cm/p*100,1)+"%"],["Break-even units",f(F/cm,0)],["Break-even $","$"+f(F/(cm/p),0)],["Units for target profit",f(u,0)],["DOL at target",t>0?f(u*cm/oi):"–"]].map(function(r){return "<div>"+r[0]+"<b>"+r[1]+"</b></div>"}).join("")}
function lc(){var a=+$("la").value,L=+$("ll").value/100,x=+$("lx").value,b=Math.log(L)/Math.LN2,y=a*Math.pow(x,b),T=x*y,T1=x>1?(x-1)*a*Math.pow(x-1,b):0;
$("lc").innerHTML=[["b",f(b,4)],["Cumulative avg y",f(y)],["Total time",f(T)],["Incremental (unit x)",f(T-T1)]].map(function(r){return "<div>"+r[0]+"<b>"+r[1]+"</b></div>"}).join("")}
["p","v","f","tp"].forEach(function(i){$(i).oninput=cv});["la","ll","lx"].forEach(function(i){$(i).oninput=lc});cv();lc();

function tab(t){["cards","quiz","calc"].forEach(function(s){$(s).className=s===t?"on":""});[].forEach.call($("nav").children,function(b){b.className=b.dataset.t===t?"on":""})}
[].forEach.call($("nav").children,function(b){b.onclick=function(){tab(b.dataset.t)}});
var h=(location.hash||"").replace("#","");if(h==="quiz"||h==="calc"||h==="cards")tab(h);
</script></body></html>
